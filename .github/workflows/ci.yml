name: PR Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false # Let all OS checks finish even if one fails
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      # - name: Lint Frontend
      #   run: bun run lint

      # Assuming your package.json has a 'build' script for the React/Vite app
      - name: Build Frontend Assets
        run: bun run build 

      - name: Check Rust Formatting
        run: cargo fmt --check

      # - name: Lint Rust Core (Clippy)
      #   run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Verify Rust Compilation
        # cargo check is significantly faster than cargo build as it skips code generation
        run: cargo check --manifest-path src-tauri/Cargo.toml