[package]
name = "samvad-graphql"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "gzip"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
uuid = { version = "1.23.3", features = ["v4"] }
chrono = "0.4.45"
tokio-util = { version = "0.7.19", features = ["rt"] }
thiserror = "2.0.20"
http = "1.5.0"
samvad-error = { path = "../samvad-error" }
samvad-models = { path = "../samvad-models" }
