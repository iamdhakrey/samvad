[package]
name = "samvad-grpc"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.14.4"
prost-reflect = {version = "0.16.5", default-features = false, features = ["serde", "derive"] }
tonic = {version = "0.14.6", default-features = false, features = ["transport"] }
ts-rs = { workspace = true }
tokio = { workspace = true }
protox = "0.9.1"
serde_json = { workspace = true }
http = "1.5.0"
tonic-reflection = "0.14.6"
tokio-stream = { version = "0.1.19", features = ["sync"] }
samvad-error = {path= "../samvad-error"}
hyper-util = "0.1.20"
hyper-rustls = "0.27.9"
rustls = "0.23.43"
rustls-native-certs = "0.8.4"
async-recursion = "1.1.1"
serde.workspace = true
thiserror = "2.0.20"
samvad-models = { version = "0.1.0", path = "../samvad-models" }
tower = "0.5.3"
tower-service = "0.3.3"
tokio-util = "0.7.19"
